spring:
  application:
    name: merch-shop

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:merch_shop}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:merch}
    password: ${DB_PASSWORD:merchpass}
    hikari:
      pool-name: merch-hikari
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: merch-shop
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,800ms,1000ms,1500ms

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  metrics:
    public: ${METRICS_PUBLIC:false}
  security:
    jwt:
      issuer: merch-shop
      secret: ${JWT_SECRET:dev-secret-cambiar-en-produccion-1234567890}
      ttl: ${JWT_TTL:PT24H}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  orders:
    reservation-ttl: ${ORDER_RESERVATION_TTL:PT15M}
    expiration-sweep-ms: ${ORDER_EXPIRATION_SWEEP_MS:60000}
    shipping-cost: ${ORDER_SHIPPING_COST:0.00}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  async:
    mail:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 200
    webhook:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 500

logging:
  level:
    root: INFO
    com.merchshop: INFO
