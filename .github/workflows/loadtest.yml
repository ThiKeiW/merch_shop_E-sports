name: Loadtest

on:
  workflow_dispatch:

concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke + stock-race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Levantar stack de carga
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml up -d --build mysql backend prometheus grafana

      - name: Esperar backend sano
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml logs backend
          exit 1

      - name: Preparar stock
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml exec -T mysql mysql -umerch -pmerchpass merch_shop < loadtest/sql/seed-loadtest.sql

      - name: Smoke
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml --profile k6 run --rm k6 run --summary-export=/results/smoke.json /scripts/smoke.js

      - name: Reset stock-race
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml exec -T mysql mysql -umerch -pmerchpass merch_shop < loadtest/sql/reset-stock-race.sql

      - name: Stock race
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml --profile k6 run --rm k6 run -e VUS=50 --summary-export=/results/stock-race.json /scripts/stock-race.js

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: loadtest/results/*.json
          if-no-files-found: ignore

      - name: Logs del stack
        if: always()
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml logs --no-color > loadtest/results/compose.log

      - name: Bajar stack
        if: always()
        run: docker compose -f compose.yaml -f loadtest/compose.loadtest.yaml down -v
